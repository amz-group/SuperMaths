<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✦ NEON AIR DRAW</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --void: #050508;
    --panel: rgba(8, 8, 18, 0.85);
    --border: rgba(0, 245, 255, 0.15);
    --cyan: #00F5FF;
    --magenta: #FF0080;
    --green: #39FF14;
    --gold: #FFD700;
    --violet: #BF5FFF;
    --white: #E8F4FF;
    --dim: rgba(232, 244, 255, 0.4);
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--void);
    font-family: 'Inter', sans-serif;
    color: var(--white);
    overflow: hidden;
    user-select: none;
  }

  /* ── MAIN STAGE ── */
  #stage {
    position: relative;
    width: 100vw; height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #webcam {
    position: absolute;
    width: 100%; height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
    opacity: 0;
    transition: opacity 1s ease;
  }
  #webcam.active { opacity: 1; }

  /* mirror-flip all canvases to match webcam */
  canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
  }

  #drawCanvas {
    transform: scaleX(-1);
    pointer-events: none;
  }

  #particleCanvas {
    transform: scaleX(-1);
    pointer-events: none;
    mix-blend-mode: screen;
  }

  #handCanvas {
    transform: scaleX(-1);
    pointer-events: none;
  }

  /* ── SPLASH ── */
  #splash {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at center, #0a0a1a 0%, var(--void) 70%);
    z-index: 100;
    transition: opacity 0.8s ease;
    gap: 24px;
  }
  #splash.hidden { opacity: 0; pointer-events: none; }

  .splash-title {
    font-family: 'Orbitron', monospace;
    font-size: clamp(2rem, 6vw, 4.5rem);
    font-weight: 900;
    letter-spacing: 0.15em;
    background: linear-gradient(135deg, var(--cyan) 0%, var(--violet) 50%, var(--magenta) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 30px rgba(0,245,255,0.5));
    animation: titlePulse 3s ease-in-out infinite;
  }

  @keyframes titlePulse {
    0%, 100% { filter: drop-shadow(0 0 30px rgba(0,245,255,0.5)); }
    50% { filter: drop-shadow(0 0 60px rgba(191,95,255,0.8)); }
  }

  .splash-sub {
    font-size: 1rem;
    color: var(--dim);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    font-weight: 300;
  }

  .splash-icon {
    font-size: 5rem;
    animation: float 3s ease-in-out infinite;
    filter: drop-shadow(0 0 20px rgba(0,245,255,0.6));
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-14px); }
  }

  #startBtn {
    margin-top: 12px;
    padding: 14px 48px;
    background: transparent;
    border: 1.5px solid var(--cyan);
    color: var(--cyan);
    font-family: 'Orbitron', monospace;
    font-size: 0.9rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 3px;
    position: relative;
    overflow: hidden;
    transition: color 0.3s, box-shadow 0.3s;
  }
  #startBtn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--cyan);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.3s ease;
    z-index: -1;
  }
  #startBtn:hover { color: var(--void); box-shadow: 0 0 30px rgba(0,245,255,0.5); }
  #startBtn:hover::before { transform: scaleX(1); }

  /* ── TOOLBAR ── */
  #toolbar {
    position: absolute;
    left: 20px; top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 50;
    opacity: 0;
    transition: opacity 0.6s ease;
    pointer-events: none;
  }
  #toolbar.visible { opacity: 1; pointer-events: all; }

  .tool-panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    backdrop-filter: blur(20px);
    box-shadow: 0 0 30px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.03);
  }

  .panel-label {
    font-family: 'Orbitron', monospace;
    font-size: 0.5rem;
    letter-spacing: 0.25em;
    color: var(--dim);
    text-align: center;
    text-transform: uppercase;
    padding-bottom: 4px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 2px;
  }

  /* Color swatches */
  .color-swatch {
    width: 32px; height: 32px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    position: relative;
  }
  .color-swatch:hover { transform: scale(1.15); }
  .color-swatch.active {
    border-color: var(--white) !important;
    transform: scale(1.2);
  }
  .color-swatch[data-color="#00F5FF"] { background: #00F5FF; box-shadow: 0 0 12px #00F5FF88; }
  .color-swatch[data-color="#FF0080"] { background: #FF0080; box-shadow: 0 0 12px #FF008088; }
  .color-swatch[data-color="#39FF14"] { background: #39FF14; box-shadow: 0 0 12px #39FF1488; }
  .color-swatch[data-color="#FFD700"] { background: #FFD700; box-shadow: 0 0 12px #FFD70088; }
  .color-swatch[data-color="#BF5FFF"] { background: #BF5FFF; box-shadow: 0 0 12px #BF5FFF88; }
  .color-swatch[data-color="#FF6B35"] { background: #FF6B35; box-shadow: 0 0 12px #FF6B3588; }

  /* Size buttons */
  .size-btn {
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    border-radius: 6px;
    border: 1px solid transparent;
    background: transparent;
    transition: background 0.2s, border-color 0.2s;
    color: var(--dim);
  }
  .size-btn:hover { background: rgba(0,245,255,0.1); color: var(--white); }
  .size-btn.active { background: rgba(0,245,255,0.15); border-color: var(--cyan); color: var(--cyan); }
  .size-dot { background: currentColor; border-radius: 50%; }

  /* Tool buttons */
  .tool-btn {
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    border-radius: 8px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--dim);
    font-size: 1.1rem;
    transition: all 0.2s;
  }
  .tool-btn:hover { background: rgba(255,255,255,0.08); color: var(--white); }
  .tool-btn.active { background: rgba(255,0,128,0.15); border-color: var(--magenta); color: var(--magenta); }
  .tool-btn.action:hover { background: rgba(255,0,128,0.1); color: var(--magenta); }

  /* ── TOP HUD ── */
  #hud {
    position: absolute;
    top: 16px; left: 50%; transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 20px;
    z-index: 50;
    opacity: 0;
    transition: opacity 0.6s ease;
  }
  #hud.visible { opacity: 1; }

  .hud-title {
    font-family: 'Orbitron', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.3em;
    color: var(--cyan);
    text-shadow: 0 0 15px var(--cyan);
    opacity: 0.8;
  }

  .hud-pill {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 5px 14px;
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    backdrop-filter: blur(20px);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #ff4444;
    animation: blink 1s ease infinite;
  }
  .status-dot.tracking { background: var(--green); animation: none; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

  /* ── BOTTOM RIGHT: Save button ── */
  #saveBtn {
    position: absolute;
    bottom: 24px; right: 24px;
    z-index: 50;
    padding: 10px 24px;
    background: transparent;
    border: 1px solid var(--gold);
    color: var(--gold);
    font-family: 'Orbitron', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 4px;
    backdrop-filter: blur(20px);
    transition: all 0.2s;
    opacity: 0;
  }
  #saveBtn.visible { opacity: 1; }
  #saveBtn:hover { background: rgba(255,215,0,0.1); box-shadow: 0 0 20px rgba(255,215,0,0.3); }

  /* ── GESTURE HINT ── */
  #gestureHint {
    position: absolute;
    bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 20px;
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    color: var(--dim);
    backdrop-filter: blur(20px);
    z-index: 50;
    opacity: 0;
    transition: opacity 0.6s;
    text-align: center;
  }
  #gestureHint.visible { opacity: 1; }

  /* ── LOADING OVERLAY ── */
  #loadingOverlay {
    position: absolute;
    inset: 0;
    background: var(--void);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    z-index: 90;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s;
  }
  #loadingOverlay.active { opacity: 1; pointer-events: all; }

  .loader-ring {
    width: 60px; height: 60px;
    border: 2px solid rgba(0,245,255,0.15);
    border-top-color: var(--cyan);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .loader-text {
    font-family: 'Orbitron', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.3em;
    color: var(--cyan);
    opacity: 0.7;
  }

  /* ── CURSOR RING ── */
  #cursorRing {
    position: absolute;
    width: 40px; height: 40px;
    border: 2px solid var(--cyan);
    border-radius: 50%;
    pointer-events: none;
    z-index: 60;
    transform: translate(-50%, -50%);
    transition: border-color 0.2s, width 0.1s, height 0.1s;
    box-shadow: 0 0 15px var(--cyan), inset 0 0 10px rgba(0,245,255,0.1);
    display: none;
  }
  #cursorRing.drawing {
    width: 20px; height: 20px;
    border-color: var(--white);
  }
</style>
</head>
<body>

<div id="stage">
  <!-- Live camera feed -->
  <video id="webcam" autoplay muted playsinline></video>

  <!-- Drawing layer -->
  <canvas id="drawCanvas"></canvas>

  <!-- Particle effects layer -->
  <canvas id="particleCanvas"></canvas>

  <!-- Hand skeleton overlay -->
  <canvas id="handCanvas"></canvas>

  <!-- Cursor ring -->
  <div id="cursorRing"></div>

  <!-- Loading overlay -->
  <div id="loadingOverlay" class="active">
    <div class="loader-ring"></div>
    <div class="loader-text">INITIALIZING HAND TRACKING</div>
  </div>

  <!-- Splash screen -->
  <div id="splash">
    <div class="splash-icon">✦</div>
    <div class="splash-title">NEON AIR DRAW</div>
    <div class="splash-sub">Draw with your fingertip in augmented reality</div>
    <button id="startBtn" onclick="startExperience()">ACTIVATE CAMERA</button>
  </div>

  <!-- Top HUD -->
  <div id="hud">
    <div class="hud-title">✦ NEON AIR DRAW</div>
    <div class="hud-pill">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">SEARCHING</span>
    </div>
    <div class="hud-pill" id="modePill">✏ DRAW</div>
  </div>

  <!-- Left toolbar -->
  <div id="toolbar">
    <!-- Colors -->
    <div class="tool-panel">
      <div class="panel-label">Color</div>
      <div class="color-swatch active" data-color="#00F5FF" onclick="setColor('#00F5FF', this)"></div>
      <div class="color-swatch" data-color="#FF0080" onclick="setColor('#FF0080', this)"></div>
      <div class="color-swatch" data-color="#39FF14" onclick="setColor('#39FF14', this)"></div>
      <div class="color-swatch" data-color="#FFD700" onclick="setColor('#FFD700', this)"></div>
      <div class="color-swatch" data-color="#BF5FFF" onclick="setColor('#BF5FFF', this)"></div>
      <div class="color-swatch" data-color="#FF6B35" onclick="setColor('#FF6B35', this)"></div>
    </div>

    <!-- Sizes -->
    <div class="tool-panel">
      <div class="panel-label">Size</div>
      <button class="size-btn" onclick="setSize(3, this)">
        <div class="size-dot" style="width:4px;height:4px"></div>
      </button>
      <button class="size-btn active" onclick="setSize(6, this)">
        <div class="size-dot" style="width:8px;height:8px"></div>
      </button>
      <button class="size-btn" onclick="setSize(12, this)">
        <div class="size-dot" style="width:14px;height:14px"></div>
      </button>
      <button class="size-btn" onclick="setSize(22, this)">
        <div class="size-dot" style="width:22px;height:22px"></div>
      </button>
    </div>

    <!-- Tools -->
    <div class="tool-panel">
      <div class="panel-label">Tools</div>
      <button class="tool-btn active" id="drawToolBtn" title="Draw" onclick="setMode('draw')">✏️</button>
      <button class="tool-btn" id="eraseToolBtn" title="Erase" onclick="setMode('erase')">🧹</button>
      <button class="tool-btn action" title="Clear All" onclick="clearCanvas()">🗑️</button>
    </div>
  </div>

  <!-- Save button -->
  <button id="saveBtn" onclick="saveDrawing()">⬇ SAVE PNG</button>

  <!-- Gesture hint -->
  <div id="gestureHint">
    ☝ RAISE INDEX FINGER to draw · ✌ TWO FINGERS to pause · ✋ OPEN HAND to erase
  </div>
</div>

<!-- MediaPipe Hands -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

<script>
// ─────────────────────────────────────────────
//  STATE
// ─────────────────────────────────────────────
const state = {
  color: '#00F5FF',
  size: 6,
  mode: 'draw',         // 'draw' | 'erase'
  drawing: false,
  lastX: null,
  lastY: null,
  tracking: false,
  started: false,
};

const particles = [];
let animFrame;
let fadeTimer;

// ─────────────────────────────────────────────
//  CANVAS SETUP
// ─────────────────────────────────────────────
const video    = document.getElementById('webcam');
const drawCvs  = document.getElementById('drawCanvas');
const partCvs  = document.getElementById('particleCanvas');
const handCvs  = document.getElementById('handCanvas');
const dCtx     = drawCvs.getContext('2d');
const pCtx     = partCvs.getContext('2d');
const hCtx     = handCvs.getContext('2d');

function resizeCanvases() {
  const w = window.innerWidth, h = window.innerHeight;
  [drawCvs, partCvs, handCvs].forEach(c => {
    c.width = w; c.height = h;
  });
}
resizeCanvases();
window.addEventListener('resize', resizeCanvases);

// ─────────────────────────────────────────────
//  UI CONTROLS
// ─────────────────────────────────────────────
function setColor(hex, el) {
  state.color = hex;
  document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
  el.classList.add('active');
}

function setSize(sz, el) {
  state.size = sz;
  document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
}

function setMode(mode) {
  state.mode = mode;
  document.getElementById('drawToolBtn').classList.toggle('active', mode === 'draw');
  document.getElementById('eraseToolBtn').classList.toggle('active', mode === 'erase');
  document.getElementById('modePill').textContent = mode === 'draw' ? '✏ DRAW' : '🧹 ERASE';
}

function clearCanvas() {
  dCtx.clearRect(0, 0, drawCvs.width, drawCvs.height);
  particles.length = 0;
}

function saveDrawing() {
  // Composite webcam + drawing
  const composite = document.createElement('canvas');
  composite.width = drawCvs.width;
  composite.height = drawCvs.height;
  const cCtx = composite.getContext('2d');

  // Draw mirrored video frame
  cCtx.save();
  cCtx.scale(-1, 1);
  cCtx.drawImage(video, -composite.width, 0, composite.width, composite.height);
  cCtx.restore();

  // Draw the drawing (already mirrored visually via CSS)
  // We need to mirror it back to match
  cCtx.save();
  cCtx.scale(-1, 1);
  cCtx.drawImage(drawCvs, -composite.width, 0, composite.width, composite.height);
  cCtx.restore();

  const link = document.createElement('a');
  link.download = `neon-air-draw-${Date.now()}.png`;
  link.href = composite.toDataURL('image/png');
  link.click();
}

// ─────────────────────────────────────────────
//  DRAWING ENGINE
// ─────────────────────────────────────────────
function drawStroke(x, y) {
  if (state.mode === 'erase') {
    dCtx.save();
    dCtx.globalCompositeOperation = 'destination-out';
    dCtx.beginPath();
    dCtx.arc(x, y, state.size * 4, 0, Math.PI * 2);
    dCtx.fillStyle = 'rgba(0,0,0,1)';
    dCtx.fill();
    dCtx.restore();
    return;
  }

  if (state.lastX === null) {
    state.lastX = x; state.lastY = y; return;
  }

  const col = state.color;
  const sz  = state.size;

  // ── Outer glow (wide, faint)
  dCtx.save();
  dCtx.globalCompositeOperation = 'source-over';
  dCtx.strokeStyle = col + '22';
  dCtx.lineWidth   = sz * 8;
  dCtx.lineCap     = 'round';
  dCtx.lineJoin    = 'round';
  dCtx.shadowBlur  = 0;
  dCtx.beginPath();
  dCtx.moveTo(state.lastX, state.lastY);
  dCtx.lineTo(x, y);
  dCtx.stroke();

  // ── Mid glow
  dCtx.strokeStyle = col + '55';
  dCtx.lineWidth   = sz * 4;
  dCtx.beginPath();
  dCtx.moveTo(state.lastX, state.lastY);
  dCtx.lineTo(x, y);
  dCtx.stroke();

  // ── Core line
  dCtx.strokeStyle = col;
  dCtx.lineWidth   = sz;
  dCtx.shadowColor = col;
  dCtx.shadowBlur  = sz * 3;
  dCtx.beginPath();
  dCtx.moveTo(state.lastX, state.lastY);
  dCtx.lineTo(x, y);
  dCtx.stroke();

  // ── Bright center
  dCtx.strokeStyle = 'rgba(255,255,255,0.85)';
  dCtx.lineWidth   = sz * 0.3;
  dCtx.shadowBlur  = 0;
  dCtx.beginPath();
  dCtx.moveTo(state.lastX, state.lastY);
  dCtx.lineTo(x, y);
  dCtx.stroke();

  dCtx.restore();

  // Emit particles
  const dist = Math.hypot(x - state.lastX, y - state.lastY);
  const count = Math.min(Math.floor(dist / 4), 8);
  for (let i = 0; i < count; i++) {
    const t = i / Math.max(count - 1, 1);
    const px = state.lastX + (x - state.lastX) * t;
    const py = state.lastY + (y - state.lastY) * t;
    spawnParticles(px, py, col);
  }
}

// ─────────────────────────────────────────────
//  PARTICLE SYSTEM
// ─────────────────────────────────────────────
function spawnParticles(x, y, color) {
  const count = 3 + Math.floor(Math.random() * 4);
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 0.5 + Math.random() * 2.5;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      decay: 0.025 + Math.random() * 0.04,
      size: 1 + Math.random() * 3,
      color,
    });
  }
}

function updateParticles() {
  pCtx.clearRect(0, 0, partCvs.width, partCvs.height);
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x  += p.vx;
    p.y  += p.vy;
    p.vy += 0.05; // gravity
    p.vx *= 0.97;
    p.life -= p.decay;
    if (p.life <= 0) { particles.splice(i, 1); continue; }

    pCtx.save();
    pCtx.globalAlpha = p.life * p.life;
    pCtx.shadowColor = p.color;
    pCtx.shadowBlur  = p.size * 4;
    pCtx.fillStyle   = p.color;
    pCtx.beginPath();
    pCtx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    pCtx.fill();
    pCtx.restore();
  }
}

// ─────────────────────────────────────────────
//  HAND SKELETON RENDERER
// ─────────────────────────────────────────────
const CONNECTIONS = [
  [0,1],[1,2],[2,3],[3,4],
  [0,5],[5,6],[6,7],[7,8],
  [5,9],[9,10],[10,11],[11,12],
  [9,13],[13,14],[14,15],[15,16],
  [13,17],[17,18],[18,19],[19,20],
  [0,17]
];

function renderHand(landmarks) {
  hCtx.clearRect(0, 0, handCvs.width, handCvs.height);
  if (!landmarks) return;

  const w = handCvs.width, h = handCvs.height;

  // Draw connections
  hCtx.save();
  hCtx.strokeStyle = 'rgba(0,245,255,0.25)';
  hCtx.lineWidth = 1.5;
  hCtx.shadowColor = '#00F5FF';
  hCtx.shadowBlur = 6;
  for (const [a, b] of CONNECTIONS) {
    const lA = landmarks[a], lB = landmarks[b];
    hCtx.beginPath();
    hCtx.moveTo(lA.x * w, lA.y * h);
    hCtx.lineTo(lB.x * w, lB.y * h);
    hCtx.stroke();
  }

  // Draw joints
  for (let i = 0; i < landmarks.length; i++) {
    const lm = landmarks[i];
    const px = lm.x * w, py = lm.y * h;
    const isIndexTip = i === 8;
    const r = isIndexTip ? 5 : 3;

    hCtx.beginPath();
    hCtx.arc(px, py, r, 0, Math.PI * 2);
    hCtx.fillStyle   = isIndexTip ? '#FFFFFF' : 'rgba(0,245,255,0.6)';
    hCtx.shadowColor = isIndexTip ? '#FFFFFF' : '#00F5FF';
    hCtx.shadowBlur  = isIndexTip ? 15 : 8;
    hCtx.fill();
  }
  hCtx.restore();
}

// ─────────────────────────────────────────────
//  GESTURE DETECTION
// ─────────────────────────────────────────────
function detectGesture(lm) {
  // Fingertip IDs: thumb=4, index=8, middle=12, ring=16, pinky=20
  // MCP base IDs:  index=5, middle=9, ring=13, pinky=17
  const fingerUp = (tip, mcp) => lm[tip].y < lm[mcp].y - 0.03;

  const index  = fingerUp(8, 5);
  const middle = fingerUp(12, 9);
  const ring   = fingerUp(16, 13);
  const pinky  = fingerUp(20, 17);

  if (index && !middle && !ring && !pinky) return 'draw';    // ☝ only index
  if (index && middle && !ring && !pinky)  return 'pause';   // ✌ index+middle
  if (index && middle && ring && pinky)    return 'erase';   // ✋ open hand
  return 'pause';
}

// ─────────────────────────────────────────────
//  MEDIAPIPE HANDS SETUP
// ─────────────────────────────────────────────
let mpHands;

async function initHandTracking() {
  mpHands = new Hands({
    locateFile: (file) =>
      `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
  });

  mpHands.setOptions({
    maxNumHands: 1,
    modelComplexity: 1,
    minDetectionConfidence: 0.7,
    minTrackingConfidence: 0.6,
  });

  mpHands.onResults(onHandResults);

  const camera = new Camera(video, {
    onFrame: async () => {
      await mpHands.send({ image: video });
    },
    width: 1280,
    height: 720,
  });

  await camera.start();

  // Camera started
  video.classList.add('active');
  document.getElementById('loadingOverlay').classList.remove('active');
  document.getElementById('toolbar').classList.add('visible');
  document.getElementById('hud').classList.add('visible');
  document.getElementById('saveBtn').classList.add('visible');
  document.getElementById('gestureHint').classList.add('visible');

  // Start animation loop
  renderLoop();
}

// ─────────────────────────────────────────────
//  HAND RESULTS CALLBACK
// ─────────────────────────────────────────────
const cursorRing = document.getElementById('cursorRing');
const statusDot  = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const modePill   = document.getElementById('modePill');

// Smoothing
let smoothX = null, smoothY = null;
const SMOOTH = 0.35;

function onHandResults(results) {
  if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
    // No hand detected
    state.tracking = false;
    state.drawing  = false;
    state.lastX    = null;
    state.lastY    = null;
    smoothX = null; smoothY = null;
    statusDot.classList.remove('tracking');
    statusText.textContent = 'SEARCHING';
    cursorRing.style.display = 'none';
    renderHand(null);
    return;
  }

  state.tracking = true;
  statusDot.classList.add('tracking');
  statusText.textContent = 'TRACKING';

  const landmarks = results.multiHandLandmarks[0];
  const w = window.innerWidth, h = window.innerHeight;

  // Index fingertip (landmark 8) — raw coords are [0,1]
  // MediaPipe gives normalized coords; x is mirrored already for CSS scaleX(-1)
  const rawX = landmarks[8].x * w;
  const rawY = landmarks[8].y * h;

  // Smoothing
  if (smoothX === null) { smoothX = rawX; smoothY = rawY; }
  smoothX += (rawX - smoothX) * SMOOTH;
  smoothY += (rawY - smoothY) * SMOOTH;

  // Detect gesture
  const gesture = detectGesture(landmarks);

  // Cursor ring position (mirrored by CSS, so use raw)
  // The ring is NOT on a mirrored canvas — position in screen space
  const screenX = w - smoothX; // un-mirror for absolute positioning
  cursorRing.style.display = 'block';
  cursorRing.style.left = screenX + 'px';
  cursorRing.style.top  = smoothY + 'px';

  if (gesture === 'draw') {
    if (state.mode === 'draw') {
      cursorRing.classList.add('drawing');
      modePill.textContent = '✏ DRAWING';
    } else {
      modePill.textContent = '🧹 ERASING';
    }
    drawStroke(smoothX, smoothY);
    state.lastX = smoothX; state.lastY = smoothY;
    state.drawing = true;
  } else if (gesture === 'erase') {
    cursorRing.classList.remove('drawing');
    modePill.textContent = '✋ ERASE MODE';
    // Temporarily erase
    dCtx.save();
    dCtx.globalCompositeOperation = 'destination-out';
    dCtx.beginPath();
    dCtx.arc(smoothX, smoothY, state.size * 6, 0, Math.PI * 2);
    dCtx.fillStyle = 'rgba(0,0,0,1)';
    dCtx.fill();
    dCtx.restore();
    state.lastX = null; state.lastY = null;
  } else {
    // pause
    cursorRing.classList.remove('drawing');
    modePill.textContent = state.mode === 'draw' ? '✏ DRAW' : '🧹 ERASE';
    state.lastX = null; state.lastY = null;
    state.drawing = false;
  }

  renderHand(landmarks);
}

// ─────────────────────────────────────────────
//  RENDER LOOP
// ─────────────────────────────────────────────
function renderLoop() {
  updateParticles();
  animFrame = requestAnimationFrame(renderLoop);
}

// ─────────────────────────────────────────────
//  START EXPERIENCE
// ─────────────────────────────────────────────
async function startExperience() {
  if (state.started) return;
  state.started = true;

  // Hide splash
  const splash = document.getElementById('splash');
  splash.classList.add('hidden');
  setTimeout(() => splash.style.display = 'none', 900);

  // Show loading
  document.getElementById('loadingOverlay').classList.add('active');
  document.querySelector('.loader-text').textContent = 'INITIALIZING HAND TRACKING';

  // Request camera permission & init
  try {
    // Pre-request permission
    await navigator.mediaDevices.getUserMedia({ video: true });
    await initHandTracking();
  } catch (err) {
    console.error(err);
    document.querySelector('.loader-text').textContent = 'CAMERA ACCESS DENIED — PLEASE ALLOW CAMERA';
    document.querySelector('.loader-ring').style.borderTopColor = '#FF0080';
  }
}
</script>
